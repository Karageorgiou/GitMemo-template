name: Verify Runethread v0.7.0 template repin

on:
  push:
    branches:
      - runethread/v0.7.0-repin

permissions:
  contents: write

jobs:
  repin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repin branch
        uses: actions/checkout@v7
        with:
          ref: runethread/v0.7.0-repin
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Verify untouched v0.6 source state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "5d5d3da9f2e8f1827402da634128c4e493bed408"
          expected='.github/workflows/repin-v0.7.0.yml'
          test "$(git diff --name-only origin/main...HEAD)" = "$expected"
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('.runethread/config.json').read_text())
          assert cfg == {
              'repository_format': 2,
              'schema_version': 1,
              'contract_version': 7,
              'runethread_version': 'v0.6.0',
          }, cfg
          lock = json.loads(Path('.runethread/lock.json').read_text())
          assert lock['lock_version'] == 2
          assert lock['source_repository'] == 'runethread/core'
          assert lock['runethread_version'] == 'v0.6.0'
          assert lock['repository_format'] == 2
          assert lock['schema_version'] == 1
          assert lock['contract_version'] == 7
          assert lock['contract_sha256'] == '5b245c55e640555c797c3f86f02b54a431da40e959bdd466f90c0c5c88c45766'
          assert len(lock['files_sha256']) == 19
          Path('/tmp/config-before.json').write_text(json.dumps(cfg, sort_keys=True))
          Path('/tmp/lock-before.json').write_text(json.dumps(lock, sort_keys=True))
          PY
          git status --short

      - name: Install immutable Runethread v0.7.0
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/runethread/core/cmd/runethread@v0.7.0
          test "$("$(go env GOPATH)/bin/runethread" version)" = "Runethread v0.7.0 (repo format 2, schema 1, contract 7, index 2, trust-lock 2)"

      - name: Run released upgrader and enforce metadata-only diff
        shell: bash
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/runethread" upgrade .
          expected=$'.runethread/config.json\n.runethread/lock.json'
          test "$(git diff --name-only | sort)" = "$expected"
          git diff --exit-code -- . ':(exclude).runethread/config.json' ':(exclude).runethread/lock.json'
          python3 - <<'PY'
          import json
          from pathlib import Path
          before_cfg = json.loads(Path('/tmp/config-before.json').read_text())
          before_lock = json.loads(Path('/tmp/lock-before.json').read_text())
          after_cfg = json.loads(Path('.runethread/config.json').read_text())
          after_lock = json.loads(Path('.runethread/lock.json').read_text())

          expected_cfg = dict(before_cfg)
          expected_cfg['runethread_version'] = 'v0.7.0'
          assert after_cfg == expected_cfg, (before_cfg, after_cfg)

          expected_lock = dict(before_lock)
          expected_lock['runethread_version'] = 'v0.7.0'
          assert after_lock == expected_lock, (before_lock, after_lock)
          assert after_lock['contract_sha256'] == before_lock['contract_sha256']
          assert after_lock['files_sha256'] == before_lock['files_sha256']
          PY

      - name: Verify v0.7 trust, validation, and index freshness
        shell: bash
        run: |
          set -euo pipefail
          test "$("$(go env GOPATH)/bin/runethread" trust version .)" = "v0.7.0"
          "$(go env GOPATH)/bin/runethread" validate .
          "$(go env GOPATH)/bin/runethread" index --check .

      - name: Commit only verified repin metadata
        shell: bash
        run: |
          set -euo pipefail
          git add .runethread/config.json .runethread/lock.json
          expected=$'.runethread/config.json\n.runethread/lock.json'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: repin memory template to Runethread v0.7.0'
          git push origin HEAD:runethread/v0.7.0-repin
