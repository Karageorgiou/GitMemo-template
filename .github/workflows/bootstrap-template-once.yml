name: Bootstrap GitMemo Template Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out template repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Install immutable GitMemo v0.3.0
        run: go install github.com/Karageorgiou/GitMemo/cmd/gitmemo@v0.3.0

      - name: Generate canonical template
        run: |
          GENERATED="$RUNNER_TEMP/gitmemo-template-generated"
          rm -rf "$GENERATED"
          "$(go env GOPATH)/bin/gitmemo" init "$GENERATED"
          "$(go env GOPATH)/bin/gitmemo" index --check "$GENERATED"
          "$(go env GOPATH)/bin/gitmemo" validate "$GENERATED"

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} + 2>/dev/null || true
          find .github/workflows -type f ! -name bootstrap-template-once.yml -delete 2>/dev/null || true

          cp -a "$GENERATED"/. .
          rm -f .github/workflows/validate.yml

          echo "Generated non-workflow template paths:"
          git status --short

      - name: Commit generated non-workflow template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate template from GitMemo v0.3.0"
            git push
          fi
