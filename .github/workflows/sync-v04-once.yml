name: Sync GitMemo Template to v0.4.0 Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out template repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'

      - name: Install immutable GitMemo v0.4.0
        run: go install github.com/Karageorgiou/GitMemo/cmd/gitmemo@v0.4.0

      - name: Regenerate canonical template
        run: |
          GENERATED="$RUNNER_TEMP/gitmemo-template-generated"
          rm -rf "$GENERATED"
          "$(go env GOPATH)/bin/gitmemo" init "$GENERATED"
          "$(go env GOPATH)/bin/gitmemo" index --check "$GENERATED"
          "$(go env GOPATH)/bin/gitmemo" validate "$GENERATED"

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$GENERATED"/. .

          echo "Generated template changes:"
          git status --short

      - name: Commit verified non-workflow template changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync template to GitMemo v0.4.0"
            git push
          fi
