name: Sync GitMemo Template v0.5.0 Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download immutable GitMemo v0.5.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.0 --repo Karageorgiou/GitMemo --pattern gitmemo-linux-amd64 --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/gitmemo-linux-amd64"
          test "$("$RUNNER_TEMP/gitmemo-linux-amd64" version)" = "v0.5.0"

      - name: Generate and validate exact template
        run: |
          FRESH="$RUNNER_TEMP/gitmemo-v050-template"
          rm -rf "$FRESH"
          "$RUNNER_TEMP/gitmemo-linux-amd64" init "$FRESH"
          "$RUNNER_TEMP/gitmemo-linux-amd64" index --check "$FRESH"
          "$RUNNER_TEMP/gitmemo-linux-amd64" validate "$FRESH"

          rsync -a --delete --exclude='.git/' "$FRESH/" ./
          diff -qr --exclude=.git "$FRESH" .

      - name: Commit exact generated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Template was already byte-identical to v0.5.0 init output."
          else
            git commit -m "chore: sync template to GitMemo v0.5.0"
            git push
          fi
